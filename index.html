<script>
(function(){
  function rr(ctx,x,y,w,h,r){
    const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);
    ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);
    ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();
  }
  function icon(size){
    const c=document.createElement('canvas');c.width=size;c.height=size;
    const x=c.getContext('2d'),s=size/180;
    x.clearRect(0,0,size,size);
    // pastel orange background
    rr(x,4*s,4*s,172*s,172*s,34*s);x.fillStyle='#FFD9B8';x.fill();
    x.lineWidth=7*s;x.strokeStyle='#251B16';x.stroke();
    // bowl
    x.beginPath();x.ellipse(90*s,105*s,55*s,24*s,0,0,Math.PI*2);x.fillStyle='#FFF8F0';x.fill();x.stroke();
    x.beginPath();x.moveTo(36*s,103*s);x.quadraticCurveTo(42*s,150*s,90*s,154*s);x.quadraticCurveTo(138*s,150*s,144*s,103*s);x.closePath();x.fillStyle='#FF9E78';x.fill();x.stroke();
    // rice paper strips
    x.strokeStyle='#F6D7A7';x.lineWidth=9*s;x.lineCap='round';
    [[60,99,105,119],[71,91,121,108],[52,112,91,135]].forEach(a=>{x.beginPath();x.moveTo(a[0]*s,a[1]*s);x.lineTo(a[2]*s,a[3]*s);x.stroke();});
    // toppings
    const dots=[[55,103,'#EFC84A'],[77,101,'#D94B35'],[99,95,'#65B96E'],[118,111,'#7F4F31'],[88,121,'#E86D9A'],[104,125,'#F3A43B']];
    dots.forEach(([cx,cy,col])=>{x.beginPath();x.arc(cx*s,cy*s,6*s,0,Math.PI*2);x.fillStyle=col;x.fill();x.lineWidth=2.5*s;x.strokeStyle='#251B16';x.stroke();});
    // spoon
    x.strokeStyle='#8C6A52';x.lineWidth=5*s;x.beginPath();x.moveTo(130*s,55*s);x.lineTo(120*s,92*s);x.stroke();
    x.beginPath();x.arc(132*s,49*s,8*s,0,Math.PI*2);x.fillStyle='#E8C9AA';x.fill();x.stroke();
    // small chili + leaf accents
    x.fillStyle='#E8483F';rr(x,40*s,56*s,22*s,8*s,4*s);x.fill();x.stroke();
    x.fillStyle='#66B87A';x.beginPath();x.ellipse(145*s,73*s,14*s,7*s,-.5,0,Math.PI*2);x.fill();x.stroke();
    // BTT monogram
    x.fillStyle='#251B16';x.font='900 '+(19*s)+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText('BTT',90*s,32*s);
    return c.toDataURL('image/png');
  }
  try{
    const i180=icon(180), i512=icon(512);
    const touch=document.getElementById('apple-touch-icon'); if(touch) touch.href=i180;
    const fav=document.getElementById('favicon'); if(fav) fav.href=i512;
    const manifest={name:'Tiệm Bánh Tráng Trộn',short_name:'Bánh Tráng',start_url:'.',display:'standalone',background_color:'#fff7ee',theme_color:'#ff7a59',icons:[{src:i180,sizes:'180x180',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const m=document.getElementById('app-manifest'); if(m) m.href=URL.createObjectURL(blob);
  }catch(e){console.warn('App icon generation failed',e)}
})();

function prepPage(){const unlocked=REC.filter(r=>s.recipes.includes(r.id));const total=Object.values(s.stock).reduce((a,b)=>a+b,0);const max=80;const ready=Math.round(total/max*100);return `<section class="card hero"><h2>🧺 ${t('prepTitle')}</h2><p>${t('prepDesc')}</p><div class="notice">📅 ${t('day')} ${s.day} · ⏰ ${fmtTime()} · ${s.open?`🟢 ${t('open')}`:`🟡 ${t('prepare')}`}</div><div class="grid2" style="margin-top:9px"><div class="notice">📦 ${t('readyParts')}: <b>${ready}%</b></div><div class="notice">📖 ${t('recipes')}: <b>${unlocked.length}/${REC.length}</b></div></div></section><section class="card"><div class="section-title"><h3>📖 ${t('recipes')}</h3><span class="tag">${t('setPrice')}</span></div>${unlocked.map(r=>`<div class="recipe-row"><div><strong>🥣 ${nm(r)}</strong><span class="sub">${r.need.map(k=>`<img class='food-img small' src=\"data:image/svg+xml;charset=UTF-8,${encodeURIComponent(foodSvg(ING[k].art))}\" alt='${esc(ING[k][s.language])}'>`).join('')} · cost ≈ ${r.need.reduce((a,k)=>a+ING[k].cost,0)} 💰</span></div><input inputmode="numeric" value="${Number(s.prices[r.id])||r.price}" style="width:88px" onchange="setRecipePrice('${r.id}',this.value)"></div>`).join('')}<button class="btn green" style="width:100%;margin-top:6px" data-act="open">🔥 ${s.open?t('sell'):t('open')} </button><p class="muted tiny" style="margin-top:6px">${t('openTip')}</p></section><section class="card"><div class="section-title"><h3>🛒 ${t('market')}</h3><button class="btn small yellow" data-page="stock">${t('stock')}</button></div>${Object.entries(ING).slice(0,6).map(([k,v])=>`<div class="stock-row"><div><strong>${foodImg(k,'small')} ${v[s.language]}</strong><span class="sub">${t('stock')}: ${s.stock[k]}</span></div><button class="btn small yellow" data-buy="${k}">+1</button></div>`).join('')}</section>`}

function homePage(){return `<section class="card hero"><h2>${t('title')} 🌶️</h2><p>${s.open?`🟢 ${t('open')}`:`🔴 ${t('closed')}`} · ${t('daily')}: <b>${s.served}/${s.goal}</b></p><div class="big-actions">${s.open?`<button class="btn orange" data-act="close">🌙 ${t('close')}</button>`:`<button class="btn primary" data-act="open">🔥 ${t('open')}</button>`}<button class="btn green" data-page="cook">🥣 ${t('order')}</button></div></section>${scene()}${s.active?orderCard():`<section class="card center"><div style="font-size:50px">🪑🥤</div><b>${s.open?'Chờ khách...':'Mở quán để bắt đầu bán!'}</b><p class="muted tiny">${t('howto')}</p></section>`}${statsCard()}`}

function statsCard(){return `<section class="card"><div class="section-title"><h3>📈 ${t('daily')}</h3><span class="tag">${s.served}/${s.goal}</span></div><div class="barrow"><div class="meter"><i style="width:${Math.min(100,s.served/s.goal*100)}%"></i></div><b>${Math.round(s.served/s.goal*100)}%</b></div><div class="grid2" style="margin-top:9px"><div class="notice">💵 ${t('money')}: ${s.revenue}</div><div class="notice">👥 ${t('customer')}: ${s.totalServed}</div></div></section>`}
function orderCard(){const o=s.active,r=REC.find(x=>x.id===o.recipe);return `<section class="card order-card ${s.mixed?'pop':''}"><div class="order-head"><div class="avatar">${o.avatar}</div><div style="flex:1"><b>${esc(o.name)}</b><div class="sub">${o.person}</div></div><span class="tag">${t('spice')} ${o.spice}/7</span></div><div class="order-body"><b>🥣 ${nm(r)}</b><div class="sub">${t('price')}: ${s.prices[r.id]} 💰</div><div class="ingredients">${r.need.map(k=>`<span class="chip ${s.selected.includes(k)?'active':''}">${foodImg(k,'small')} ${ING[k][s.language]}</span>`).join('')}</div><div style="margin-top:8px" class="barrow"><div class="meter"><i style="width:${o.patience}%"></i></div><span class="tiny">${o.patience}%</span></div></div><div class="big-actions" style="margin-top:8px">${s.mixed?`<button class="btn green" data-act="serve">✅ ${t('serve')}</button>`:`<button class="btn yellow" data-act="toCook">🥣 ${t('cook')}</button>`}<button class="btn pink" data-act="skip">❌</button></div></section>`}
function cookPage(){if(!s.open&&!s.active)return `<section class="card center"><div style="font-size:55px">🥣</div><h3>${t('closed')}</h3><button class="btn primary" data-act="open">🔥 ${t('open')}</button></section>`;if(!s.active)return `<section class="card center"><div style="font-size:55px">⌛</div><h3>${t('order')}</h3><p class="muted">Chờ khách gọi món...</p></section>`;const r=REC.find(x=>x.id===s.active.recipe);return `<section class="card"><div class="section-title"><h3>🥣 ${nm(r)}</h3><span class="tag">${s.selected.length}/${r.need.length}</span></div><div class="bowl-stage"><div class="bowl ${s.mixing?'mixing':''}"><div class="inside">${s.selected.length?s.selected.map(k=>foodImg(k,'bowl-food')).join(' '):foodImg('paper','bowl-food')}${s.mixed?'<div style="font-size:14px;font-weight:1000">✨ READY</div>':''}</div><div class="ready">${s.mixed?t('ready'):t('mix')}</div></div><div><div class="notice">${t('howto')}</div><div class="ingredient-grid" style="margin-top:7px">${r.need.map(k=>`<button class="ingredient ${s.selected.includes(k)?'disabled':''}" ${s.selected.includes(k)||s.stock[k]<=0?'disabled':''} data-add="${k}"><span class="food-photo-wrap">${foodImg(k)}</span><span>${ING[k][s.language]}</span><small>x${s.stock[k]}</small></button>`).join('')}</div></div></div><div class="big-actions" style="margin-top:10px">${s.mixed?`<button class="btn green" data-act="serve">💰 ${t('serve')}</button>`:`<button class="btn orange" data-act="mix" ${s.selected.length===r.need.length?'':'disabled'}>🥢 ${t('mix')}</button>`}<button class="btn dark" data-act="resetBowl">↩️</button></div></section>`}
function stockPage(){return `<section class="card"><div class="section-title"><h3>📦 ${t('stock')}</h3><span class="tag">${Object.values(s.stock).reduce((a,b)=>a+b,0)}</span></div>${Object.entries(ING).map(([k,v])=>`<div class="stock-row"><div><strong>${foodImg(k,'small')} ${v[s.language]}</strong><span class="sub">💰 ${v.cost} / cái · ${t('stock')}: ${s.stock[k]}</span></div><button class="btn small yellow" data-buy="${k}">+1</button></div>`).join('')}</section><section class="card"><div class="section-title"><h3>📖 ${t('recipes')}</h3><span class="tag">${s.recipes.length}/${REC.length}</span></div>${REC.map(r=>{const ok=s.recipes.includes(r.id);return `<div class="recipe-row"><div><strong>🥣 ${nm(r)}</strong><span class="sub">${r.need.map(k=>`<img class='food-img small' src=\"data:image/svg+xml;charset=UTF-8,${encodeURIComponent(foodSvg(ING[k].art))}\" alt='${esc(ING[k][s.language])}'>`).join('')} · ${s.prices[r.id]} 💰</span></div>${ok?`<span class="tag">✓</span>`:`<button class="btn small blue" data-unlock="${r.id}">${t('upgrade')} ${r.unlock*60}💰</button>`}</div>`}).join('')}</section><section class="card"><div class="section-title"><h3>👩‍🍳 ${t('staff')}</h3><span class="tag">${s.staff.length}/${STAFF.length}</span></div>${STAFF.map(st=>{const hired=s.staff.includes(st.id);return `<div class="staff-row"><div><strong>${st.emoji} ${st.name[s.language]}</strong><span class="sub">${st.role[s.language]} · ${st.cost}💰</span></div>${hired?`<span class="tag">✓</span>`:`<button class="btn small green" data-hire="${st.id}">${t('hire')}</button>`}</div>`}).join('')}</section>`}
function rankPage(){const rows=[['Bạn',s.totalRevenue],['🍜 Tiệm Mì Cay',s.leader],['🥤 Tiệm Ăn Vặt',Math.floor(s.leader*.91)],['🍢 Quán Góc Phố',Math.floor(s.leader*.83)],['🍓 Tiệm Trà Sữa',Math.floor(s.leader*.77)]];rows.sort((a,b)=>b[1]-a[1]);return `<section class="card hero"><h2>🏆 ${t('rank')}</h2><p>Doanh thu tích lũy của bạn: <b>${s.totalRevenue} 💰</b></p></section><section class="card">${rows.map((r,i)=>`<div class="rank-row"><b style="width:28px">#${i+1}</b><div style="flex:1"><strong>${r[0]}</strong><span class="sub">${i===0?'Bạn đang chơi':i===1?'Đối thủ':'Tiệm địa phương'}</span></div><b>${r[1]} 💰</b></div>`).join('')}</section><section class="card center"><div style="font-size:50px">🏅</div><b>Giải Bánh Tráng Mỗi Ngày</b><p class="muted tiny">Phục vụ đủ mục tiêu để nhận bonus cuối ngày.</p><button class="btn yellow" data-act="finishEarly">🏁 ${t('daily')}</button></section>`}
function settingsPage(){return `<section class="card"><h3>⚙️ ${t('settings')}</h3><div class="section-title"><b>🌐 ${t('lang')}</b></div><div class="lang-options">${[['vi','🇻🇳','Tiếng Việt'],['en','🇺🇸','English'],['zh','🇨🇳','中文']].map(x=>`<button class="lang ${s.language===x[0]?'sel':''}" data-lang="${x[0]}">${x[1]}<br><span style="font-size:11px">${x[2]}</span></button>`).join('')}</div><div class="grid2" style="margin-top:10px"><button class="btn green" data-act="save">💾 ${t('save')}</button><button class="btn blue" data-act="showCode">🔐 ${t('code')}</button></div><button class="btn pink" style="width:100%;margin-top:8px" data-act="reset">🗑️ ${t('reset')}</button></section><section class="card"><div class="section-title"><h3>🏪 ${t('name')}</h3><button class="btn small yellow" data-act="editName">✏️</button></div><p><b>${esc(s.name)}</b></p><div class="section-title"><h3>👑 ${t('boss')}</h3><button class="btn small yellow" data-act="editBoss">✏️</button></div><p><b>${esc(s.boss)}</b></p></section><section class="card"><b>💾 ${t('auto')}</b><p class="muted tiny">Save nằm trong trình duyệt và mã save dùng để chuyển tiến trình sang file HTML khác.</p></section>`}
function renderLanguage(){document.getElementById('app').innerHTML=`<div class="app" style="display:grid;place-items:center;padding:18px"><section class="card" style="width:100%;max-width:520px;text-align:center;margin-top:12vh"><div style="font-size:64px">🥣🌶️</div><h1>Tiệm Bánh Tráng Trộn</h1><p class="muted">Chọn ngôn ngữ / Choose Language / 选择语言</p><div class="lang-options" style="margin-top:14px">${[['vi','🇻🇳','Tiếng Việt'],['en','🇺🇸','English'],['zh','🇨🇳','中文']].map(x=>`<button class="lang" data-startlang="${x[0]}">${x[1]}<br><span style="font-size:11px">${x[2]}</span></button>`).join('')}</div></section></div>`;document.querySelectorAll('[data-startlang]').forEach(b=>b.onclick=()=>{s.language=b.dataset.startlang;s.first=true;save();showNameModal()})}
function showNameModal(){const m=document.getElementById('modal');if(!m)return;document.getElementById('modal').className='modal show';document.getElementById('modal').innerHTML=`<div class="sheet"><button class="btn small pink close" onclick="document.getElementById('modal').className='modal'">✕</button><h3>🏪 ${t('start')}</h3><p class="muted">${t('name')}</p><input id="newName" value="${esc(s.name)}" maxlength="24"><p class="muted">${t('boss')}</p><input id="newBoss" value="${esc(s.boss)}" maxlength="18"><button class="btn green" style="width:100%;margin-top:10px" onclick="finishSetup()">🔥 ${t('start')}</button></div>`}
function finishSetup(){s.name=(document.getElementById('newName').value||s.name).trim();s.boss=(document.getElementById('newBoss').value||s.boss).trim();s.first=false;save();document.getElementById('modal').className='modal';render()}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function newOrder(){if(!s.open||s.active||s.served>=s.goal)return;const unlocked=REC.filter(r=>s.recipes.includes(r.id));const r=unlocked[Math.floor(Math.random()*unlocked.length)];const people=[['👧🏻','Học sinh'],['👦🏻','Game thủ'],['👩🏻','Nhân viên văn phòng'],['👨🏻','Khách bình thường'],['👵🏻','Cô khó tính'],['🧑🏻','Khách food reviewer']];const p=people[Math.floor(Math.random()*people.length)];s.active={recipe:r.id,avatar:p[0],person:p[1],name:['Linh','Minh','An','Mai','Nam','Vy'][Math.floor(Math.random()*6)],spice:Math.floor(Math.random()*8),patience:100};s.selected=[];s.mixed=false;save();render();}
function openShop(){if(s.minutes>=1320){toast('🌙 Hết giờ');return}s.open=true;newOrder();toast('🔥 '+t('open'));save();render()}
function closeShop(){s.open=false;toast('🌙 '+t('close'));save();render()}
function addIng(k){if(!s.active)return;const r=REC.find(x=>x.id===s.active.recipe);if(!r.need.includes(k)||s.selected.includes(k)||s.stock[k]<=0)return;s.selected.push(k);render()}
function doMix(){if(!s.active)return;const r=REC.find(x=>x.id===s.active.recipe);if(s.selected.length!==r.need.length)return;const has=s.selected.every(k=>r.need.includes(k));if(!has)return toast(t('wrong'));s.mixing=true;render();setTimeout(()=>{s.mixing=false;s.mixed=true;save();render()},s.staff.includes('mai')?650:1100)}
function serve(){if(!s.active||!s.mixed)return;const r=REC.find(x=>x.id===s.active.recipe);r.need.forEach(k=>{s.stock[k]--});let price=s.prices[r.id],tip=Math.random()<.55?Math.floor(price*(0.05+Math.random()*0.2)):0;if(s.staff.includes('nam'))tip+=Math.floor(price*.05);let earned=price+tip;s.money+=earned;s.revenue+=earned;s.totalRevenue+=earned;s.served++;s.totalServed++;s.xp+=15+r.need.length*3;if(level()>5)s.xp=500;s.rep=Math.min(5,s.rep+(Math.random()<.7?.04:-.02));s.reviews.unshift({stars:tip>0?5:Math.random()<.7?5:4,text:tip>0?'Ngon xỉu!':'Đúng công thức, ăn rất đã!',money:earned});if(s.reviews.length>12)s.reviews.pop();float('+'+earned+' 💰',false);float('+'+(15+r.need.length*3)+' XP',true);toast('✅ '+t('success'));s.active=null;s.selected=[];s.mixed=false;save();render();setTimeout(newOrder,350);if(s.served>=s.goal){setTimeout(()=>endDay(true),700)}}
function skip(){s.active=null;s.selected=[];s.mixed=false;save();render();setTimeout(newOrder,300)}
function resetBowl(){s.selected=[];s.mixed=false;render()}
function endDay(){s.open=false;s.bestDay=Math.max(s.bestDay,s.revenue);save();showSummary()}
function showSummary(){const m=document.getElementById('modal');m.className='modal show';m.innerHTML=`<div class="sheet"><h3>🌙 ${t('closeDay')}</h3><div class="grid2"><div class="notice">💰 +${s.revenue}</div><div class="notice">👥 ${s.served}/${s.goal}</div><div class="notice">⭐ ${s.rep.toFixed(1)}</div><div class="notice">✨ +XP</div></div><button class="btn green" style="width:100%;margin-top:10px" onclick="nextDay()">☀️ ${t('nextDay')}</button></div>`}
function nextDay(){document.getElementById('modal').className='modal';s.day++;s.minutes=360;s.open=false;s.active=null;s.selected=[];s.mixed=false;s.served=0;s.revenue=0;s.cost=0;s.goal=5+Math.floor(Math.random()*4);save();render()}
function buy(k){const v=ING[k];if(Object.values(s.stock).reduce((a,b)=>a+b,0)>=80)return toast(t('full'));if(s.money<v.cost)return toast(t('notEnough'));s.money-=v.cost;s.stock[k]++;s.cost+=v.cost;save();render()}
function setRecipePrice(id,v){const r=REC.find(x=>x.id===id);let n=Math.max(1,Math.floor(Number(v)||r.price));s.prices[id]=n;save();render()}
function unlock(id){const r=REC.find(x=>x.id===id),cost=r.unlock*60;if(s.recipes.includes(id))return;if(s.money<cost)return toast(t('notEnough'));s.money-=cost;s.recipes.push(id);save();render();toast('🔓 '+nm(r))}
function hire(id){const x=STAFF.find(a=>a.id===id);if(s.staff.includes(id))return;if(s.money<x.cost)return toast(t('notEnough'));s.money-=x.cost;s.staff.push(id);save();render();toast('👩‍🍳 '+t('hire')+' '+x.name[s.language])}
function bytesToBase64(bytes){let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(bin)}
function base64ToBytes(text){const clean=text.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');const pad=clean.length%4;if(pad===2)text=clean+'==';else if(pad===3)text=clean+'=';else text=clean;const bin=atob(text);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function encodeSaveCode(){const payload={v:2,game:s};const bytes=new TextEncoder().encode(JSON.stringify(payload));return 'BTT2.'+bytesToBase64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeSaveCode(raw){const v=String(raw||'').trim().replace(/^```(?:text)?/i,'').replace(/```$/,'').trim();if(!v)throw new Error('empty');if(v.startsWith('BTT2.')){const bytes=base64ToBytes(v.slice(5));const json=new TextDecoder().decode(bytes);const p=JSON.parse(json);if(!p||p.v!==2||!p.game)throw new Error('invalid');return p.game;}const old=v.replace(/\s+/g,'');const json=decodeURIComponent(escape(atob(old)));const p=JSON.parse(json);if(!p||typeof p!=='object')throw new Error('invalid');return p}
function showCode(){const m=document.getElementById('modal');const code=encodeSaveCode();m.className='modal show';m.innerHTML=`<div class="sheet"><button class="btn small pink close" onclick="closeSaveModal()">✕</button><h3>🔐 ${t('code')}</h3><p class="muted tiny">${t('codeHint')||'Copy mã này để lưu sang file/game khác. Bạn có thể dán mã dài nhiều dòng.'}</p><textarea class="codebox" id="code" spellcheck="false">${code}</textarea><div class="grid2"><button class="btn yellow" onclick="copyCode()">📋 ${t('copy')||'Copy'}</button><button class="btn blue" onclick="pasteCode()">📥 ${t('paste')||'Dán mã'}</button></div><button class="btn green" style="width:100%;margin-top:8px" onclick="importCode()">✅ ${t('import')}</button><div id="codeStatus" class="muted tiny" style="margin-top:7px"></div></div>`}
function closeSaveModal(){document.getElementById('modal').className='modal'}
function copyCode(){const e=document.getElementById('code');const done=()=>{const st=document.getElementById('codeStatus');if(st)st.textContent='✅ Đã sao chép mã save';toast('✅ Copied')};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(e.value).then(done).catch(()=>{e.focus();e.select();document.execCommand('copy');done()})}else{e.focus();e.select();document.execCommand('copy');done()}}
async function pasteCode(){try{const txt=await navigator.clipboard.readText();const e=document.getElementById('code');if(txt){e.value=txt;toast('✅ Đã dán mã save');}}catch{toast('📋 Hãy dán thủ công vào ô mã save')}}
function importCode(){const e=document.getElementById('code');const v=e?e.value:'';try{const x=decodeSaveCode(v);if(!x||typeof x!=='object')throw new Error('invalid');s={...fresh(),...x};if(!s.language)s.language='vi';if(!s.stock)s.stock={};if(!s.recipes)s.recipes=['basic'];if(!s.prices)s.prices={basic:24,beef:42,full:66,spicy:72};save();closeSaveModal();render();toast('✅ Loaded')}catch(err){const st=document.getElementById('codeStatus');if(st)st.textContent='❌ Mã save không hợp lệ hoặc bị thiếu ký tự';toast('❌ Invalid save code')}}
function editName(){const x=prompt(t('name'),s.name);if(x){s.name=x.trim();save();render()}}function editBoss(){const x=prompt(t('boss'),s.boss);if(x){s.boss=x.trim();save();render()}}
function float(text,xp){const d=document.createElement('div');d.className=xp?'xp-fly':'money-fly';d.style.left=(40+Math.random()*20)+'%';d.style.top='48%';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function toast(text){const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function bindEvents(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{s.language=b.dataset.lang;save();render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addIng(b.dataset.add));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>unlock(b.dataset.unlock));document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>hire(b.dataset.hire));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='open')openShop();if(a==='close')closeShop();if(a==='cook'){page='cook';render()}if(a==='toCook'){page='cook';render()}if(a==='mix')doMix();if(a==='serve')serve();if(a==='skip')skip();if(a==='resetBowl')resetBowl();if(a==='finishEarly'&&s.served>0)endDay();if(a==='save'){save();toast('✅ '+t('save'))}if(a==='showCode')showCode();if(a==='reset'){if(confirm('Reset?')){s=fresh();save();render()}}if(a==='editName')editName();if(a==='editBoss')editBoss()})}
let last=Date.now();setInterval(()=>{if(!s.language||s.first)return;const now=Date.now();if(now-last<900)return;last=now;if(s.open&&s.minutes<1320){s.minutes++;if(s.active){s.active.patience=Math.max(0,s.active.patience-0.7);if(s.active.patience<=0)skip()}if(!s.active)newOrder();if(s.minutes>=1320)endDay();save();if(page==='home'||page==='cook')render()}},1000);
const modal=document.createElement('div');modal.id='modal';modal.className='modal';document.body.appendChild(modal);
if(s.first&&s.language){showNameModal()}render();
</script></body></html>
