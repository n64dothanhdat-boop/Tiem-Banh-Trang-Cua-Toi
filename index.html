<script>
(function(){
  function rr(ctx,x,y,w,h,r){
    const q=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+q,y);
    ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);
    ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();
  }
  function icon(size){
    const c=document.createElement('canvas');c.width=size;c.height=size;
    const x=c.getContext('2d'),s=size/180;
    x.clearRect(0,0,size,size);
    rr(x,4*s,4*s,172*s,172*s,34*s);x.fillStyle='#FFD9B8';x.fill();
    x.lineWidth=7*s;x.strokeStyle='#251B16';x.stroke();
    x.beginPath();x.ellipse(90*s,105*s,55*s,24*s,0,0,Math.PI*2);x.fillStyle='#FFF8F0';x.fill();x.stroke();

    x.strokeStyle='#F6D7A7';x.lineWidth=9*s;x.lineCap='round';

    const dots=[[55,103,'#EFC84A'],[77,101,'#D94B35'],[99,95,'#65B96E'],[118,111,'#7F4F31'],[88,121,'#E86D9A'],[104,125,'#F3A43B']];
    dots.forEach(([cx,cy,col])=>{x.beginPath();x.arc(cx*s,cy*s,6*s,0,Math.PI*2);x.fillStyle=col;x.fill();x.lineWidth=2.5*s;x.strokeStyle='#251B16';x.stroke();});
    x.strokeStyle='#8C6A52';x.lineWidth=5*s;x.beginPath();x.moveTo(130*s,55*s);x.lineTo(120*s,92*s);x.stroke();
    x.beginPath();x.arc(132*s,49*s,8*s,0,Math.PI*2);x.fillStyle='#E8C9AA';x.fill();x.stroke();
    x.fillStyle='#E8483F';rr(x,40*s,56*s,22*s,8*s,4*s);x.fill();x.stroke();
    x.fillStyle='#66B87A';x.beginPath();x.ellipse(145*s,73*s,14*s,7*s,-.5,0,Math.PI*2);x.fill();x.stroke();

    return c.toDataURL('image/png');
  }

    const touch=document.getElementById('apple-touch-icon'); if(touch) touch.href=i180;
    const fav=document.getElementById('favicon'); if(fav) fav.href=i512;
    const manifest={name:'Tiệm Bánh Tráng Trộn',short_name:'Bánh Tráng',start_url:'.',display:'standalone',background_color:'#fff7ee',theme_color:'#ff7a59',icons:[{src:i180,sizes:'180x180',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
    const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});
    const m=document.getElementById('app-manifest'); if(m) m.href=URL.createObjectURL(blob);
  }catch(e){console.warn('App icon generation failed',e)}
})();
</script>

function migrate(st){
  try{
    st=st&&typeof st==='object'?st:{};

    if(!st.prices||typeof st.prices!=='object')st.prices={basic:24000,beef:42000,full:66000,spicy:72000,fresh:48000,shrimp:58000,sausage:64000,cheese:70000,supreme:95000};
    if(!Array.isArray(st.recipes)||!st.recipes.length)st.recipes=['basic'];
    if(!Array.isArray(st.upgrades))st.upgrades=[];
    if(!Array.isArray(st.staff))st.staff=[];
    if(!Array.isArray(st.reviews))st.reviews=[];
    if(!Array.isArray(st.achClaimed))st.achClaimed=[];

    if(!Array.isArray(st.decor))st.decor=[];

    if(st.bestCombo==null)st.bestCombo=0;

    if(st.eventDay==null)st.eventDay=0;
    if(st.money==null)st.money=1500000;
    if(st.day==null)st.day=1;
    if(st.minutes==null||!Number.isFinite(st.minutes))st.minutes=typeof DAY_START==='number'?DAY_START:360;if(st.minutes>=(typeof DAY_END==='number'?DAY_END:1320))st.minutes=typeof DAY_START==='number'?DAY_START:360;st.dayStartedAt=null;
    if(st.rep==null)st.rep=5;
    if(st.xp==null)st.xp=0;
    if(st.name==null)st.name='Tiệm Bánh Tráng';
    if(st.boss==null)st.boss='Boss';
    if(st.goal==null)st.goal=6;
    if(st.served==null)st.served=0;
    if(st.totalServed==null)st.totalServed=0;
    if(st.totalRevenue==null)st.totalRevenue=0;
    if(st.revenue==null)st.revenue=0;
    if(st.open==null)st.open=false;if(st.tutorialDone==null)st.tutorialDone=false;if(st.tutorialDone){st.tutorial=-1}else if(st.tutorial==null||st.tutorial<0){st.tutorial=0}if(!Array.isArray(st.recentOrders))st.recentOrders=[];
    if(st.active===undefined)st.active=null;
    Object.keys(ING).forEach(k=>{if(st.stock[k]==null)st.stock[k]=0});
    REC.forEach(r=>{if(st.prices[r.id]==null)st.prices[r.id]=r.price});
    return st;
  }catch(e){console.warn('migrate fail',e);return fresh()}
}

function recipeHeat(r){
  if(!r) return 'med';
  if(r.id==='spicy'||r.id==='sausage') return 'hot';
  if(r.id==='fresh'||r.id==='cheese') return 'mild';
  const need=r.need||[];
  const hotN=need.filter(k=>k==='chili'||k==='satay').length;
  if(need.includes('chili')||hotN>=2) return 'hot';
  if(r.id==='basic'||hotN===0) return 'mild';
  return 'med';
}

function pickRecipe(want){
  if(tutActive()&&tutStep()<=4) return REC.find(x=>x.id==='basic')||REC[0];
  const unlocked=REC.filter(r=>s.recipes.includes(r.id));
  if(!unlocked.length) return REC[0];
  if(unlocked.length===1) return unlocked[0];
  want = want || pickCustomerHeat();
  let pool=unlocked.filter(r=>recipeHeat(r)===want);
  if(!pool.length){if(want==='hot')pool=unlocked.filter(r=>recipeHeat(r)!=='mild');else if(want==='mild')pool=unlocked.filter(r=>recipeHeat(r)!=='hot');else pool=unlocked.slice();}
  if(!pool.length) pool=unlocked.slice();
  const recent=s.recentOrders||[];
  let prefer=pool.filter(r=>!recent.includes(r.id));
  if(!prefer.length) prefer=pool;
  const weights=prefer.map(r=>{let w=1+(r.unlock||1)*0.3;if(recipeHeat(r)===want)w*=2.5;if(recent.includes(r.id))w*=0.2;return w;});
  const sum=weights.reduce((a,b)=>a+b,0);
  let t=Math.random()*sum;
  for(let i=0;i<prefer.length;i++){t-=weights[i];if(t<=0)return prefer[i];}
  return prefer[prefer.length-1];
}
function newOrder(){
  if(!s.open||s.active||s.served>=s.goal)return;

  const heat=pickCustomerHeat();
  const r=pickRecipe(heat);
  const c=pickCustomer();
  const rush=tutActive()?false:((s.event==='rush'&&Math.random()<.45)||Math.random()<.12);
  const spice=heat==='hot'?(5+Math.floor(Math.random()*3)):heat==='mild'?Math.floor(Math.random()*3):(2+Math.floor(Math.random()*3));
  s.active={recipe:r.id,avatar:c.avatar,person:c.person,name:c.name,spice,heat,patience:rush?70:100,rush};
  s.selected=[];s.mixed=false;

function showSummary(){const m=document.getElementById('modal');m.className='modal show';const bonus=s.dayBonus||0;const st=s.streak||0;m.innerHTML=`<div class="sheet"><h3>🌙 ${t('closeDay')}</h3><div class="grid2"><div class="notice">💰 +${fmt(s.revenue)}</div><div class="notice">👥 ${s.served}/${s.goal}</div><div class="notice">⭐ ${s.rep.toFixed(1)}</div><div class="notice">🔥 ${t('streak')}: ${st}</div></div>${bonus?`<div class="notice" style="margin-top:8px">🎁 ${t('dayBonus')}: +${fmt(bonus)}</div>`:''}${s.bestCombo>=3?`<div class="notice" style="margin-top:6px">✨ ${t('combo')} max: x${s.bestCombo}</div>`:''}<button class="btn green" style="width:100%;margin-top:10px" onclick="nextDay()">☀️ ${t('nextDay')}</button></div>`}
function nextDay(){document.getElementById('modal').className='modal';s.day++;s.minutes=(typeof DAY_START==='number'?DAY_START:360);s.open=false;s.dayStartedAt=null;s.active=null;s.selected=[];s.mixed=false;s.served=0;s.revenue=0;s.cost=0;s.goal=5+Math.floor(Math.random()*4);save();render()}
function buy(k,qty){qty=qty||1;const v=ING[k];if(!v)return;if(level()<(v.lv||1))return toast('🔒 Lv.'+(v.lv||1));const total=Object.values(s.stock).reduce((a,b)=>a+b,0);if(total+qty>maxStock())return toast(t('full'));const unit=stockCost(k);const cost=unit*qty;if(s.money<cost)return toast(t('notEnough'));s.money-=cost;s.stock[k]=(s.stock[k]||0)+qty;s.cost+=cost;sfx('coin');save();render()}
function setRecipePrice(id,v){const r=REC.find(x=>x.id===id);let n=Math.max(1000,Math.floor(Number(v)||r.price));s.prices[id]=n;save();render()}
function canUnlockRecipe(r){return level()>=r.unlock}
function tryAutoUnlockRecipes(){let unlocked=[];REC.forEach(r=>{if(!s.recipes.includes(r.id)&&level()>=r.unlock){s.recipes.push(r.id);if(s.prices[r.id]==null)s.prices[r.id]=r.price;unlocked.push(r)}});return unlocked}
function unlock(id){const r=REC.find(x=>x.id===id);if(!r||s.recipes.includes(id))return;if(level()<r.unlock)return toast('🔒 Lv.'+r.unlock);const cost=Math.max(0,(r.unlock-1)*40000);if(s.money<cost)return toast(t('notEnough'));s.money-=cost;s.recipes.push(id);if(s.prices[r.id]==null)s.prices[r.id]=r.price;sfx('ok');save();render();toast('🔓 '+nm(r))}
function showLevelUp(prevLv,newLv){const d=document.createElement('div');d.className='level-banner';const news=REC.filter(r=>r.unlock>prevLv&&r.unlock<=newLv);const tops=Object.entries(ING).filter(([k,v])=>(v.lv||1)>prevLv&&(v.lv||1)<=newLv);let msg='⭐ LEVEL UP '+newLv+'!';if(news.length)msg+='\n🔓 '+news.map(r=>nm(r)).join(', ');if(tops.length)msg+='\n🥗 '+tops.map(([k,v])=>v[s.language]||v.vi).join(', ');d.textContent=msg;document.body.appendChild(d);sfx('level');setTimeout(()=>d.remove(),2800)}
function gainXp(n){const prev=level();s.xp=Math.min(20*100,(s.xp||0)+n);const now=level();if(now>prev){tryAutoUnlockRecipes();showLevelUp(prev,now)}}
function hire(id){const x=STAFF.find(a=>a.id===id);if(s.staff.includes(id))return;if(s.money<x.cost)return toast(t('notEnough'));s.money-=x.cost;s.staff.push(id);save();render();toast('👩‍🍳 '+t('hire')+' '+x.name[s.language])}
function bytesToBase64(bytes){let bin='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)bin+=String.fromCharCode(...bytes.subarray(i,i+chunk));return btoa(bin)}
function base64ToBytes(text){const clean=text.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');const pad=clean.length%4;if(pad===2)text=clean+'==';else if(pad===3)text=clean+'=';else text=clean;const bin=atob(text);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
function encodeSaveCode(){const payload={v:2,game:s};const bytes=new TextEncoder().encode(JSON.stringify(payload));return 'BTT2.'+bytesToBase64(bytes).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function decodeSaveCode(raw){const v=String(raw||'').trim().replace(/^```(?:text)?/i,'').replace(/```$/,'').trim();if(!v)throw new Error('empty');if(v.startsWith('BTT2.')){const bytes=base64ToBytes(v.slice(5));const json=new TextDecoder().decode(bytes);const p=JSON.parse(json);if(!p||p.v!==2||!p.game)throw new Error('invalid');return p.game;}const old=v.replace(/\s+/g,'');const json=decodeURIComponent(escape(atob(old)));const p=JSON.parse(json);if(!p||typeof p!=='object')throw new Error('invalid');return p}
function showCode(){const m=document.getElementById('modal');const code=encodeSaveCode();m.className='modal show';m.innerHTML=`<div class="sheet"><button class="btn small pink close" onclick="closeSaveModal()">✕</button><h3>🔐 ${t('code')}</h3><p class="muted tiny">${t('codeHint')||'Copy mã này để lưu sang file/game khác.'}</p><textarea class="codebox" id="code" spellcheck="false">${code}</textarea><div class="grid2"><button class="btn yellow" onclick="copyCode()">📋 ${t('copy')||'Copy'}</button><button class="btn blue" onclick="pasteCode()">📥 ${t('paste')||'Dán mã'}</button></div><button class="btn green" style="width:100%;margin-top:8px" onclick="importCode()">✅ ${t('import')}</button><div id="codeStatus" class="muted tiny" style="margin-top:7px"></div></div>`}
function closeSaveModal(){document.getElementById('modal').className='modal'}
function copyCode(){const e=document.getElementById('code');const done=()=>{const st=document.getElementById('codeStatus');if(st)st.textContent='✅ Đã sao chép mã save';toast('✅ Copied')};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(e.value).then(done).catch(()=>{e.focus();e.select();document.execCommand('copy');done()})}else{e.focus();e.select();document.execCommand('copy');done()}}
async function pasteCode(){try{const txt=await navigator.clipboard.readText();const e=document.getElementById('code');if(txt){e.value=txt;toast('✅ Đã dán mã save');}}catch{toast('📋 Hãy dán thủ công vào ô mã save')}}
function importCode(){const e=document.getElementById('code');const v=e?e.value:'';try{const x=decodeSaveCode(v);if(!x||typeof x!=='object')throw new Error('invalid');s=migrate({...fresh(),...x});if(!s.language)s.language='vi';if(!s.stock)s.stock={};if(!s.recipes)s.recipes=['basic'];if(!s.prices)s.prices={basic:24000,mango:36000,beef:42000,egg:38000,full:66000,spicy:72000,fresh:48000,shrimp:58000,sausage:64000,cheese:70000,supreme:95000,seafood:88000,legend:120000};save();closeSaveModal();render();toast('✅ Loaded')}catch(err){const st=document.getElementById('codeStatus');if(st)st.textContent='❌ Mã save không hợp lệ hoặc bị thiếu ký tự';toast('❌ Invalid save code')}}
function editName(){const x=prompt(t('name'),s.name);if(x){s.name=x.trim();save();render()}}function editBoss(){const x=prompt(t('boss'),s.boss);if(x){s.boss=x.trim();save();render()}}
function sendReviewReply(id){const r=s.reviews.find(x=>String(x.id)===String(id));if(!r)return;const el=document.getElementById('reply-'+id);const text=(el?.value||'').trim();if(!text)return toast('✍️ '+t('replyPlaceholder'));r.reply=text.slice(0,250);save();render();toast('✅ '+t('replySaved'))}
function editReviewReply(id){const r=s.reviews.find(x=>String(x.id)===String(id));if(!r)return;const m=document.getElementById('modal');m.className='modal show';m.innerHTML=`<div class="sheet"><button class="btn small pink close" onclick="document.getElementById('modal').className='modal'">✕</button><h3>💬 ${t('reply')}</h3><p class="muted">${esc(r.author||t('customer'))}</p><textarea id="editReply" maxlength="250" style="width:100%;min-height:110px;border:2px solid var(--ink);border-radius:8px;padding:8px;font:600 .82rem/1.4 system-ui,sans-serif">${esc(r.reply||'')}</textarea><button class="btn green" style="width:100%;margin-top:10px" onclick="saveEditedReply('${id}')">✅ ${t('sendReply')}</button></div>`}
function saveEditedReply(id){const r=s.reviews.find(x=>String(x.id)===String(id));if(!r)return;const el=document.getElementById('editReply');const text=(el?.value||'').trim();if(!text)return;r.reply=text.slice(0,250);save();document.getElementById('modal').className='modal';render();toast('✅ '+t('replySaved'))}
function float(text,xp){const d=document.createElement('div');d.className=xp?'xp-fly':'money-fly';d.style.left=(40+Math.random()*20)+'%';d.style.top='48%';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}function toast(text){const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

function finishSellingEarly(){if(tutActive()){tutBlock();return}if(!s.open)return;if(!confirm(t('finishConfirm')))return;toast('🏠 '+t('backHome'));endDay()}

const TUT_STEPS=['welcome','prep','add','mix','serve','done'];
function tutActive(){return s&&!s.tutorialDone&&s.tutorial!=null&&s.tutorial>=0}
function tutStep(){return tutActive()? (typeof s.tutorial==='number'?s.tutorial:0) : -1}
function tutId(){const i=tutStep();return i>=0&&i<TUT_STEPS.length?TUT_STEPS[i]:null}
function tutAdvance(){if(!tutActive())return;s.tutorial=(s.tutorial||0)+1;save();render()}
function tutFinish(){s.tutorialDone=true;s.tutorial=-1;document.body.classList.remove('tut-lock');save();render();toast('🎉 '+t('tutDone'))}
function tutBlock(msg){toast('👉 '+(msg||t('tutSkipBlocked')))}
function tutAllow(act){
  if(!tutActive())return true;
  const id=tutId();
  if(id==='welcome'||id==='done')return act==='tutNext';
  if(id==='prep')return act==='open';
  if(id==='add')return act==='add';
  if(id==='mix')return act==='mix';
  if(id==='serve')return act==='serve';
  return false;
}
function renderTutorial(){
  document.body.classList.remove('tut-lock');
  const old = document.getElementById('tutRoot');
  if (old) old.remove();
  if (!tutActive()) return;

  const id = tutId();
  const titles = {welcome:t('tutWelcome'),prep:t('tutPrep'),add:t('tutAdd'),mix:t('tutMix'),serve:t('tutServe'),done:t('tutDone')};
  const descs = {welcome:t('tutWelcomeDesc'),prep:t('tutPrepDesc'),add:t('tutAddDesc'),mix:t('tutMixDesc'),serve:t('tutServeDesc'),done:t('tutDoneDesc')};
  const stepN = Math.min((s.tutorial || 0) + 1, TUT_STEPS.length);
  const labels = {welcome:'✨ '+t('tutGo'),prep:'🔥 '+t('startSelling'),add:'🥗 '+t('tutAdd'),mix:'🥢 '+t('mix'),serve:'✅ '+t('serve'),done:'🎉 '+t('tutNext')};

  if (id === 'prep') page = 'prepare';

  const root = document.createElement('div');
  root.id = 'tutRoot';
  root.className = 'tut-overlay';
  root.innerHTML = '<div class="tut-card">' +
    '<div class="tut-step">' + t('tutTitle') + ' · ' + stepN + '/' + TUT_STEPS.length + '</div>' +
    '<h4>' + (titles[id] || '') + '</h4>' +
    '<p>' + (descs[id] || '') + '</p>' +
    '<button type="button" class="btn primary" id="tutActionBtn">' + (labels[id] || t('tutNext')) + '</button>' +
    '<div class="tut-hint">👆 ' + (s.language === 'en' ? 'Tap the button above' : s.language === 'zh' ? '点击上方按钮' : 'Bấm nút phía trên') + '</div>' +
    '</div>';
  document.body.appendChild(root);

  const btn = document.getElementById('tutActionBtn');
  if (!btn) return;

  let busy = false;
  function run() {
    if (busy) return;
    busy = true;
    try {
      if (id === 'welcome') { s.tutorial = 1; page = 'prepare'; s.open = false; save(); render(); return; }
      if (id === 'done') { tutFinish(); return; }
      if (id === 'prep') {
        ['paper','salt','satay','herb'].forEach(k => { s.stock[k] = Math.max(s.stock[k] || 0, 5); });
        if (!s.recipes.includes('basic')) s.recipes.push('basic');
        s.event = 'none'; s.goal = 99; s.open = true; s.tutorial = 2;
        s.active = null; s.selected = []; s.mixed = false;
        newOrder();
        if (s.active) { s.active.recipe = 'basic'; s.active.rush = false; s.active.patience = 100; }
        s.selected = []; s.mixed = false;
        save(); render(); return;
      }
      if (id === 'add') {
        if (!s.open) { s.open = true; }
        if (!s.active) { s.active = { recipe:'basic', avatar:'👧🏻', person:'Học sinh', name:'An', spice:2, patience:100, rush:false }; }
        s.active.recipe = 'basic';
        const r = REC.find(x => x.id === 'basic');
        const next = r.need.find(k => !s.selected.includes(k));
        if (next) { if ((s.stock[next]||0) <= 0) s.stock[next] = 5; s.selected.push(next); }
        if (s.selected.length >= r.need.length) { s.tutorial = 3; }
        save(); render(); return;
      }
      if (id === 'mix') {
        const r = REC.find(x => x.id === 'basic');
        if (!s.active) { s.active = { recipe:'basic', avatar:'👧🏻', person:'Học sinh', name:'An', spice:2, patience:100, rush:false }; }
        r.need.forEach(k => { if (!s.selected.includes(k)) { if ((s.stock[k]||0) <= 0) s.stock[k] = 5; s.selected.push(k); } });
        s.mixing = false; s.mixed = true; s.tutorial = 4;
        save(); render(); return;
      }
      if (id === 'serve') {
        if (!s.active) { s.active = { recipe:'basic', avatar:'👧🏻', person:'Học sinh', name:'An', spice:2, patience:100, rush:false }; }
        s.mixed = true;
        const r = REC.find(x => x.id === 'basic');
        r.need.forEach(k => { s.stock[k] = Math.max(0, (s.stock[k]||0) - 1); });
        const price = s.prices.basic || 24000;
        const earned = price + 5000;
        s.money += earned; s.revenue = (s.revenue||0) + earned; s.totalRevenue = (s.totalRevenue||0) + earned;
        s.served = (s.served||0) + 1; s.totalServed = (s.totalServed||0) + 1;
        if (typeof gainXp === 'function') gainXp(20); else s.xp = (s.xp||0) + 20;
        s.combo = (s.combo||0) + 1; s.bestCombo = Math.max(s.bestCombo||0, s.combo);
        s.reviews = s.reviews || [];
        s.reviews.unshift({ id: Date.now(), author: s.active.name, role: s.active.person, avatar: s.active.avatar, stars: 5, text: 'Ngon xỉu!', money: earned, reply: '' });
        s.active = null; s.selected = []; s.mixed = false; s.tutorial = 5;
        toast('✅ ' + t('success') + ' +' + fmt(earned));
        save(); render(); return;
      }
    } catch (err) { console.error('tut action', err); busy = false; toast('⚠️ Lỗi tutorial, thử lại'); }
  }

  btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); run(); });
}


function bindEvents(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(tutActive()&&tutId()!=='done'){tutBlock();return}page=b.dataset.page;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{s.language=b.dataset.lang;save();render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addIng(b.dataset.add));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buy(b.dataset.buy));document.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>unlock(b.dataset.unlock));document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>hire(b.dataset.hire));document.querySelectorAll('[data-send-reply]').forEach(b=>b.onclick=()=>sendReviewReply(b.dataset.sendReply));document.querySelectorAll('[data-edit-reply]').forEach(b=>b.onclick=()=>editReviewReply(b.dataset.editReply));document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='open')openShop();if(a==='close')closeShop();if(a==='mix')doMix();if(a==='serve')serve();if(a==='skip')skip();if(a==='resetBowl')resetBowl();if(a==='finishEarly')finishSellingEarly();if(a==='save'){save();toast('✅ '+t('save'))}if(a==='showCode')showCode();if(a==='reset'){if(confirm('Reset?')){s=fresh();save();render()}}if(a==='editName')editName();if(a==='editBoss')editBoss();if(a==='toggleSound'){s.sound=!s.sound;save();toast('🔊 '+(s.sound?t('soundOn'):t('soundOff')));render()}if(a==='replayTut'){s.tutorialDone=false;s.tutorial=0;s.open=false;page='prepare';save();render()}});document.querySelectorAll('[data-buy5]').forEach(b=>b.onclick=()=>buy(b.dataset.buy5,5));document.querySelectorAll('[data-buy10]').forEach(b=>b.onclick=()=>buy(b.dataset.buy10,10));document.querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>buyUpgrade(b.dataset.upgrade));document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claimAch(b.dataset.claim))}
let last=Date.now();
setInterval(()=>{
  if(!s.language||s.first)return;
  const now=Date.now();
  const dt=Math.min(2,(now-last)/1000);
  if(dt<0.25)return;
  last=now;
  if(s.open&&!(typeof tutActive==='function'&&tutActive())){
    const _start=typeof DAY_START==='number'?DAY_START:360;
    const _end=typeof DAY_END==='number'?DAY_END:1320;
    const _span=typeof DAY_SPAN==='number'?DAY_SPAN:(_end-_start);
    const _ms=typeof DAY_MS==='number'?DAY_MS:(5*60*1000);
    if(!Number.isFinite(s.minutes))s.minutes=_start;
    if(s.minutes>=_end){endDay();return}
    if(!s.dayStartedAt)s.dayStartedAt=now;
    const elapsed=now-s.dayStartedAt;
    s.minutes=Math.min(_end, _start + Math.floor(_span * elapsed / _ms));
    if(s.active){if(!s.mixed){const drain=patienceDrain()*dt*1.6;s.active.patience=Math.max(0,s.active.patience-drain);if(s.active.patience<=0)skip();}}
    if(!s.active)newOrder();
    if(s.minutes>=(typeof DAY_END==='number'?DAY_END:1320))endDay();
    save();
    if(s.open||page==='home'||page==='cook'||page==='prepare')render();
  }
},250);

const modal=document.createElement('div');modal.id='modal';modal.className='modal';document.body.appendChild(modal);
(function boot(){
  try{
    if(!s||typeof s!=='object')s=fresh();
    s=migrate(s);
    if(s.language){try{tryAutoUnlockRecipes();save()}catch(e){}}
    if(s.language&&!s.tutorialDone){if((s.totalServed||0)>0){s.tutorialDone=true;s.tutorial=-1}else if(s.tutorial==null||s.tutorial<0)s.tutorial=0}
    if(s.first&&s.language){try{showNameModal()}catch(e){console.warn(e);s.first=false}}
    render();
  }catch(err){
    console.error('boot error',err);
    try{localStorage.removeItem(KEY)}catch(_){}
    s=fresh();
    try{render()}catch(e2){
      document.getElementById('app').innerHTML='<div class="app" style="padding:24px;text-align:center"><section class="card"><h2>🥣 Lỗi tải game</h2><p>Bấm nút để chơi lại từ đầu.</p><button class="btn green" style="width:100%" onclick="localStorage.removeItem(\''+KEY+'\');location.reload()">🔄 Chơi lại</button></section></div>';
    }
  }
})();
</script>
